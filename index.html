        </div>
        <button onclick="copyItinerary()" id="copyBtn" class="bg-white/20 hover:bg-white/30 active:scale-95 transition text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 backdrop-blur-sm border border-white/20">
          <span>📋</span>

        </button>
      </div>

        </div>

      </div>
    </div>

      <div class="max-w-2xl mx-auto flex overflow-x-auto no-scrollbar px-2 py-2 gap-1.5" id="dayTabs"></div>
    </nav>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4" id="mainContent"></main>

  <!-- 底部快速切換列 -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2.5 z-40">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
      <button onclick="changeDay(-1)" id="prevBtn" class="flex-1 py-2.5 px-4 rounded-xl font-bold text-sm bg-slate-100 text-slate-700 active:scale-95 transition disabled:opacity-40">
        ← 上一頁

      </button>
    </div>
